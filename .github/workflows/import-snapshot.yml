name: Import validated data snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: civicatlas-data-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    environment: production-data
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests/python -v
      - run: uv run --locked python -m pipeline.build --check
      - run: uv run --locked sentinels check --root . --config sentinels.toml --json
      - run: bunx wrangler d1 export civicatlas-prod --remote --output=/tmp/civicatlas-before-import.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: civicatlas-before-import
          path: /tmp/civicatlas-before-import.sql
      - run: bun run db:import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      - name: Verify imported snapshot revision
        run: |
          python - <<'PYTHON'
          import json
          import subprocess
          from pathlib import Path
          snapshot = json.loads(Path("data/processed/snapshot.json").read_text())
          actual = json.loads(subprocess.check_output([
              "curl", "--fail", "--silent", "--show-error", "--retry", "3",
              "https://atlas.goldenmonkey.dev/api/health",
          ], text=True))
          expected = {
              "status": "ok",
              "revision": snapshot["dataset_revision"],
              "year": int(snapshot["year"]),
              "ownership": "private",
              "countyCount": int(snapshot["jurisdiction_count"]),
          }
          if actual != expected:
              raise SystemExit(f"Production snapshot mismatch: expected {expected}, received {actual}")
          print(f"Verified {actual['revision']} across {actual['countyCount']} jurisdictions.")
          PYTHON
