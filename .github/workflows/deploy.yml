name: Check and deploy CivicAtlas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: civicatlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests/python -v
      - run: uv run python -m pipeline.build --check
      - run: uv run python tools/sentinel.py --root . --entry pipeline.build:main --required pipeline.validate:validate_snapshot
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: civicatlas-build
          path: dist/
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
